<!-- Permission Modal -->
<div id="permission-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>Enable Notifications</h3>
        <p>We need your permission to notify you when your order is ready.</p>
        <div class="modal-actions">
            <button id="allow-notifications" class="btn-primary">Allow</button>
            <button id="deny-notifications" class="btn-secondary">Later</button>
        </div>
    </div>
</div>

<!-- Feedback Modal -->
<div id="feedback-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h3>Send Feedback</h3>
        <textarea id="feedback-text" placeholder="Tell us about your experience..."></textarea>
        <button id="submit-feedback" class="btn-primary">Send</button>
    </div>
</div>
