<!-- Add Outlet Modal (Bootstrap 5) -->
<div class="modal fade" id="addOutletModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px; border: none; padding: 10px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title" style="font-weight: 600; color: #333;">Select Outlet</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="outlet-selection-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <!-- Javascript will populate this -->
                </div>
            </div>
            <div class="modal-footer border-0 justify-content-center pt-0">
                <button type="button" id="confirm-outlet-selection" class="btn btn-warning rounded-pill w-100 py-2"
                    style="background-color: #FDBF50; color: #333; font-weight: 600;">Continue</button>
            </div>
        </div>
    </div>
</div>

<!-- Menu Modal (Keep as placeholder if needed later) -->
<div class="modal fade" id="menu-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body">Loading Menu...</div>
        </div>
    </div>
</div>

<!-- Status Notification Modal -->
<div class="modal fade" id="statusNotificationModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static"
    data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content"
            style="border-radius: 20px; border: 3px solid #FDBF50; padding: 20px; background: linear-gradient(135deg, #fff 0%, #fffbf0 100%);">
            <div class="modal-body text-center" style="padding: 30px 20px;">
                <!-- Icon -->
                <div style="font-size: 4rem; color: #FDBF50; margin-bottom: 20px;">
                    <i class="fas fa-bell" style="animation: ring 1s ease-in-out infinite;"></i>
                </div>

                <!-- Title -->
                <h4 style="font-weight: 700; color: #333; margin-bottom: 15px;">Order Status Update</h4>

                <!-- Status Message -->
                <div id="statusNotificationMessage"
                    style="font-size: 1.5rem; font-weight: 600; color: #FDBF50; margin-bottom: 10px; text-transform: uppercase;">
                    <!-- Status will be inserted here -->
                </div>

                <!-- Token Number -->
                <div id="statusNotificationToken" style="font-size: 1.1rem; color: #666; margin-bottom: 25px;">
                    <!-- Token number will be inserted here -->
                </div>

                <!-- OK Button -->
                <button type="button" id="statusNotificationOkBtn" class="btn btn-warning rounded-pill px-5 py-3"
                    style="background-color: #FDBF50; color: #333; font-weight: 700; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(253, 191, 80, 0.4);">
                    OK
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes ring {

        0%,
        100% {
            transform: rotate(-15deg);
        }

        50% {
            transform: rotate(15deg);
        }
    }
</style>
