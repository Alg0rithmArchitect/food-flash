<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - Food Flash</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f4f4f9;
        }

        /* Sidebar (Order List) */
        .sidebar {
            width: 300px;
            background-color: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background-color: #007bff;
            color: white;
            text-align: center;
        }

        .order-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .order-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.3s;
        }

        .order-item:hover {
            background-color: #f8f9fa;
        }

        .order-item.active {
            background-color: #e9ecef;
            border-left: 4px solid #007bff;
        }

        .order-token {
            font-weight: bold;
            font-size: 1.1em;
        }

        .order-status {
            font-size: 0.9em;
            color: #666;
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #ddd;
            background-color: #f8f9fa;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            font-size: 14px;
            position: relative;
        }

        .message.manager {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.customer {
            background-color: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            background-color: white;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #007bff;
        }

        button {
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Empty State */
        .no-selection {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #888;
            font-size: 1.2em;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Active Orders</h2>
        </div>
        <div class="order-list">
            {% for order in active_orders %}
            <div class="order-item" onclick="selectOrder('{{ order.token_number }}', this)">
                <div class="order-token">Token #{{ order.token_number }}</div>
                <div class="order-status">{{ order.status }}</div>
            </div>
            {% empty %}
            <div style="padding: 20px; text-align: center; color: #777;">
                No active orders.
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="chat-area">
        <div id="no-chat-selected" class="no-selection">
            Select an order to start chatting
        </div>

        <div id="chat-interface" style="display: none; height: 100%; flex-direction: column;">
            <div class="chat-header">
                <h3 style="margin: 0;">Chat with Token #<span id="current-token"></span></h3>
            </div>

            <div class="chat-messages" id="chat-box">
                <!-- Messages will appear here -->
            </div>

            <div class="input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentToken = null;
        let pollInterval = null;

        function selectOrder(token, element) {
            // UI Updates
            document.querySelectorAll('.order-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Show Chat Interface
            document.getElementById('no-chat-selected').style.display = 'none';
            document.getElementById('chat-interface').style.display = 'flex';
            document.getElementById('current-token').innerText = token;

            // Logic Updates
            currentToken = token;

            // Clear previous chat
            document.getElementById('chat-box').innerHTML = '<div style="text-align:center; padding: 20px; color:#888;">Loading...</div>';

            // Reset Polling
            if (pollInterval) clearInterval(pollInterval);
            fetchMessages();
            pollInterval = setInterval(fetchMessages, 3000);
        }

        async function fetchMessages() {
            if (!currentToken) return;
            try {
                const response = await fetch(`/api/orders/chat/${currentToken}/?t=${new Date().getTime()}`);
                if (response.ok) {
                    const messages = await response.json();
                    renderMessages(messages);
                }
            } catch (error) {
                console.error("Error fetching messages:", error);
            }
        }

        function renderMessages(messages) {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = ''; // Clear loading/old messages

            if (messages.length === 0) {
                chatBox.innerHTML = '<div style="text-align:center; color:#ccc; margin-top:20px;">No messages yet.</div>';
                return;
            }

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender.toLowerCase()}`;
                div.innerHTML = `
                    <div style="font-size:0.8em; margin-bottom:2px; opacity:0.8;">
                        ${msg.sender === 'MANAGER' ? 'You' : 'Customer'}
                    </div>
                    ${msg.message}
                `;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentToken) return;

            try {
                const response = await fetch(`/api/orders/chat/${currentToken}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: 'MANAGER', message: text })
                });

                if (response.ok) {
                    input.value = '';
                    fetchMessages(); // Refresh immediately
                }
            } catch (error) {
                console.error("Error sending message:", error);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>

</html>
