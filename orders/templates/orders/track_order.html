<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 1.5rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #status-container {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 4px;
            display: none;
        }

        /* Chat Styles */
        #chat-container {
            margin-top: 2rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            /* Hidden until tracking starts */
            background: #fff;
        }

        #chat-box {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .message {
            margin-bottom: 8px;
            padding: 5px 10px;
            border-radius: 15px;
            max-width: 80%;
            font-size: 14px;
        }

        .message.customer {
            background-color: #007bff;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .message.manager {
            background-color: #e9ecef;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 20px;
            margin-right: 5px;
            margin-bottom: 0;
        }

        .chat-input-area button {
            width: auto;
            padding: 8px 15px;
            border-radius: 20px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Track Your Order</h1>
        <div id="input-section">
            <input type="number" id="token-input" placeholder="Enter Token Number" required>
            <button id="track-btn">Track Order</button>
        </div>
        <div id="token-display" style="display:none; margin-bottom: 20px;">
            <h3>Token #<span id="display-token"></span></h3>
        </div>
        <div id="status-container"></div>
        <button id="toggle-chat-btn" style="display:none; margin-top: 15px; background-color: #6c757d;">Chat with
            Manager</button>

        <!-- Chat Section -->
        <div id="chat-container">
            <div id="chat-box"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const trackBtn = document.getElementById('track-btn');
        const tokenInput = document.getElementById('token-input');
        const statusContainer = document.getElementById('status-container');

        async function fetchOrderStatus(token) {
            if (!token) {
                showStatus('Please enter a token number.', 'error');
                return;
            }

            try {
                // Get outlet_id for context
                const urlParams = new URLSearchParams(window.location.search);
                const outletId = urlParams.get('outlet_id');
                let url = `/api/orders/track/?token=${token}`;
                if (outletId) url += `&outlet_id=${outletId}`;

                const response = await fetch(url);
                const data = await response.json();

                if (response.ok) {
                    showStatus(`Order Status: <strong>${data.status}</strong>`, 'success');

                    // Enable Chat if track is successful
                    if (typeof initChat === 'function') {
                        initChat(token);
                        document.getElementById('toggle-chat-btn').style.display = 'block';
                    }
                } else {
                    showStatus(data.detail || 'Order not found.', 'error');
                }
            } catch (error) {
                showStatus('An error occurred while fetching the order status.', 'error');
                console.error('Error:', error);
            }
        }

        trackBtn.addEventListener('click', () => {
            fetchOrderStatus(tokenInput.value);
        });

        // Auto-tracking logic with Strict Context
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const outletId = urlParams.get('outlet_id');

            // Strict Check -> Redirect to Selection
            if (!outletId) {
                console.warn("Outlet ID missing, redirecting to selection page...");
                window.location.href = '/food-flash/';
                return;
            }

            if (token) {
                tokenInput.value = token;
                // Switch UI to read-only mode for token
                document.getElementById('input-section').style.display = 'none';
                document.getElementById('display-token').innerText = token;
                document.getElementById('token-display').style.display = 'block';

                fetchOrderStatus(token);

                if (typeof initChat === 'function') {
                    initChat(token);
                    document.getElementById('toggle-chat-btn').style.display = 'block';
                }
            } else {
                // Static Mode (Outlet Context Only) - Just let the input form show
                console.log("Static Mode: Outlet " + outletId);
            }
        });

        // Chat Toggle Logic
        const toggleChatBtn = document.getElementById('toggle-chat-btn');
        const localChatContainer = document.getElementById('chat-container');

        toggleChatBtn.addEventListener('click', () => {
            if (localChatContainer.style.display === 'none' || localChatContainer.style.display === '') {
                localChatContainer.style.display = 'block';
                toggleChatBtn.innerText = 'Hide Chat';
            } else {
                localChatContainer.style.display = 'none';
                toggleChatBtn.innerText = 'Chat with Manager';
            }
        });

        function showStatus(message, type) {
            statusContainer.innerHTML = message;
            statusContainer.style.display = 'block';
        }

        // Web Push Logic
        // Web Push Logic
        const publicVapidKey = 'BPTw3DAbPvZZcJBdPHwLHLhDESa0ThAlUKO0mEQibYX4mMYEp5q3XT7eBK0f1WmndGM6leioko-LwtmmQTmAOCo';

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/-/g, '+')
                .replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(function (registration) {
                    console.log('Service Worker Registered Successfully:', registration);

                    // Request Notification Permission
                    Notification.requestPermission().then(function (result) {
                        if (result === 'granted') {
                            console.log('Notification permission granted');

                            // Subscribe to PushManager
                            registration.pushManager.subscribe({
                                userVisibleOnly: true,
                                applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                            }).then(function (subscription) {
                                console.log('Push Subscription:', subscription);

                                // Prevent duplicate sending per page load
                                if (window.subscriptionSent) return;

                                const urlParams = new URLSearchParams(window.location.search);
                                const token = urlParams.get('token') || document.getElementById('token-input').value;

                                if (token) {
                                    fetch('/api/orders/push/subscribe/', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                        },
                                        body: JSON.stringify({
                                            token_number: token,
                                            endpoint: subscription.endpoint,
                                            keys: {
                                                p256dh: btoa(String.fromCharCode.apply(null, new Uint8Array(subscription.getKey('p256dh')))),
                                                auth: btoa(String.fromCharCode.apply(null, new Uint8Array(subscription.getKey('auth'))))
                                            }
                                        })
                                    }).then(function (response) {
                                        if (response.ok) {
                                            console.log('Subscription sent to backend successfully');
                                            window.subscriptionSent = true;
                                        } else {
                                            console.error('Failed to send subscription to backend');
                                        }
                                    }).catch(function (err) {
                                        console.error('Error sending subscription to backend:', err);
                                    });
                                }
                            }).catch(function (err) {
                                console.error('Subscription failed:', err);
                            });

                        } else if (result === 'denied') {
                            console.log('Notification permission denied');
                        } else {
                            console.log('Notification permission dismissed');
                        }
                    });
                })
                .catch(function (error) {
                    console.error('Service Worker Registration Failed:', error);
                });
        }
    </script>
    <script>
        // --- Chat Logic ---
        const chatContainer = document.getElementById('chat-container');
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        let currentToken = null;
        let chatPollInterval = null;

        function initChat(token) {
            if (currentToken === token) return; // Already initialized
            currentToken = token;
            // chatContainer.style.display = 'block'; // Don't auto-show
            fetchMessages();
            if (chatPollInterval) clearInterval(chatPollInterval);
            chatPollInterval = setInterval(fetchMessages, 3000);
        }

        async function fetchMessages() {
            if (!currentToken) return;
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const outletId = urlParams.get('outlet_id');
                let url = `/api/orders/chat/${currentToken}/?t=${new Date().getTime()}`;
                if (outletId) url += `&outlet_id=${outletId}`;

                const response = await fetch(url);
                if (response.ok) {
                    const messages = await response.json();
                    renderMessages(messages);
                }
            } catch (error) {
                console.error("Error fetching messages:", error);
            }
        }

        function renderMessages(messages) {
            chatBox.innerHTML = '';
            if (messages.length === 0) {
                chatBox.innerHTML = '<div style="text-align:center; color:#ccc; margin-top:20px;">No messages yet.</div>';
            }
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender.toLowerCase()}`;
                div.innerHTML = `<strong>${msg.sender === 'CUSTOMER' ? 'You' : 'Manager'}:</strong> ${msg.message}`;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !currentToken) return;

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const outletId = urlParams.get('outlet_id');
                let url = `/api/orders/chat/${currentToken}/`;
                if (outletId) url += `?outlet_id=${outletId}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: 'CUSTOMER', message: text })
                });

                if (response.ok) {
                    chatInput.value = '';
                    fetchMessages();
                }
            } catch (error) {
                console.error("Error sending message:", error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
    </script>
</body>

</html>
