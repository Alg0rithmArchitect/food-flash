<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 1.5rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status-container {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Track Your Order</h1>
        <input type="number" id="token-input" placeholder="Enter Token Number" required>
        <button id="track-btn">Track Order</button>
        <div id="status-container"></div>
    </div>

    <script>
        const trackBtn = document.getElementById('track-btn');
        const tokenInput = document.getElementById('token-input');
        const statusContainer = document.getElementById('status-container');

        trackBtn.addEventListener('click', async () => {
            const token = tokenInput.value;
            if (!token) {
                showStatus('Please enter a token number.', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/orders/track/?token=${token}`);
                const data = await response.json();

                if (response.ok) {
                    showStatus(`Order Status: <strong>${data.status}</strong>`, 'success');
                } else {
                    showStatus(data.detail || 'Order not found.', 'error');
                }
            } catch (error) {
                showStatus('An error occurred while fetching the order status.', 'error');
                console.error('Error:', error);
            }
        });

        function showStatus(message, type) {
            statusContainer.innerHTML = message;
            statusContainer.className = ''; // Reset classes
            statusContainer.classList.add(type);
            statusContainer.style.display = 'block';
        }
    </script>
</body>
</html>
