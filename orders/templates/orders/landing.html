<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Flash - Welcome</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%);
            color: #333;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            color: #FF6B6B;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 18px;
            text-align: center;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #FF6B6B;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #FF6B6B;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #EE5253;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Food Flash ⚡</h1>
        <p>Enter your token number to track your order.</p>

        <input type="number" id="token-input" placeholder="Token #" inputmode="numeric">
        <button onclick="trackOrder()">Track Order</button>
    </div>

    <script>
        // Parse outlet_id from URL
        const urlParams = new URLSearchParams(window.location.search);
        const outletId = urlParams.get('outlet_id');

        // Logic: If no Outlet ID, show selection list
        if (!outletId) {
            document.querySelector('.card').innerHTML = `
                <h1>Select Store 🏪</h1>
                <p>Please choose your outlet:</p>
                <div id="outlet-list" style="text-align:left;">
                    <p style="text-align:center;">Loading outlets...</p>
                </div>
            `;
            fetchOutlets();
        }

        async function fetchOutlets() {
            try {
                const response = await fetch('/api/orders/outlets/');
                const outlets = await response.json();

                const list = document.getElementById('outlet-list');
                list.innerHTML = ''; // Clear loading

                if (outlets.length === 0) {
                    list.innerHTML = '<p style="text-align:center;">No outlets found.</p>';
                } else {
                    outlets.forEach(outlet => {
                        const div = document.createElement('div');
                        div.style.padding = '15px';
                        div.style.margin = '10px 0';
                        div.style.background = '#f8f9fa';
                        div.style.borderRadius = '8px';
                        div.style.cursor = 'pointer';
                        div.style.border = '1px solid #eee';
                        div.style.display = 'flex';
                        div.style.justifyContent = 'space-between';
                        div.style.alignItems = 'center';
                        div.innerHTML = `<strong>${outlet.name}</strong> <span style="color:#888;">${outlet.restaurant_name || ''}</span>`;
                        div.onclick = () => selectOutlet(outlet.id);
                        list.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error loading outlets:', error);
                document.getElementById('outlet-list').innerHTML = '<p style="color:red; text-align:center;">Failed to load outlets.</p>';
            }
        }

        function selectOutlet(id) {
            window.location.href = `/food-flash/track/?outlet_id=${id}`;
        }

        function trackOrder() {
            const token = document.getElementById('token-input').value;
            if (token && outletId) {
                // Redirect to the tracking URL with outlet_id
                window.location.href = `/food-flash/track/?token=${token}&outlet_id=${outletId}`;
            } else if (!token) {
                alert("Please enter a token number.");
            } else if (!outletId) {
                alert("Unexpected state: Outlet ID missing during tracking.");
            }
        }

        // Allow enter key
        const input = document.getElementById('token-input');
        if (input) {
            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') trackOrder();
            });
        }
    </script>

</body>

</html>
