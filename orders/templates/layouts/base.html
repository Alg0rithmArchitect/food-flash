{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Food Flash{% endblock %}</title>
    <!-- Core CSS -->
    <link rel="stylesheet" href="{% static 'orders/css/styles.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'orders/css/chat_card.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'orders/css/outlet_selection.css' %}">
    <link rel="stylesheet" href="{% static 'orders/css/food_status.css' %}">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.BASE = '/food-flash/';
    </script>
    <script src="{% static 'orders/js/scripts.js' %}?v={% now 'U' %}" type="module"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
